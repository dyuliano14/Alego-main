<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards - Regimento Interno</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Flashcards - Regimento Interno</h1>
    </header>

    <main>
        <section id="flashcard-container">
            <div id="flashcard" tabindex="0" aria-label="Flashcard atual">
                <div id="pergunta" class="face frente"></div>
                <div id="resposta" class="face verso"></div>
            </div>

            <div id="controles">
                <button id="anterior" aria-label="Flashcard anterior">⏮️ Anterior</button>
                <button id="embaralhar" aria-label="Embaralhar flashcards">🔀 Embaralhar</button>
                <button id="proximo" aria-label="Próximo flashcard">⏭️ Próximo</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Seu Nome</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
