<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ver Conteúdo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    h1, h2, h3 { color: #2c3e50; }
    pre, code { background: #f4f4f4; padding: 5px; border-radius: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>📘 Conteúdo da Disciplina</h1>
  <div id="conteudo-md">⏳ Carregando conteúdo...</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const materia = params.get('m') || 'portugues';
    const mdFile = `${materia}.md`;

    fetch(mdFile)
      .then(resp => resp.text())
      .then(texto => {
        document.getElementById('conteudo-md').innerHTML = marked.parse(texto);
      })
      .catch(() => {
        document.getElementById('conteudo-md').innerHTML = '❌ Erro ao carregar conteúdo.';
      });
  </script>
</body>
</html>
